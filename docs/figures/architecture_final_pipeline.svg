<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Un spectre brut est resample, TIC-normalise et SNIP-corrige, puis deux vues augmentees traversent le meme encodeur ResNet-1D a poids partages ; la sortie se separe en un chemin global et un chemin local qui composent la perte VICRegL. Apres entrainement, l'encodeur gele produit une carte locale decoupee en segments m/z (pooling spatial) avant la sonde d'identification d'espece.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#556773"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,Helvetica,Arial,sans-serif;fill:#16212B;}
    .b{fill:#FFFFFF;stroke:#556773;stroke-width:1.2;rx:5;}
    .ba{stroke:#0E7C86;}
    .bb{stroke:#A8571A;}
    .bn{stroke:#1D6E3C;}
    .t{font-size:12px;}
    .ts{font-size:10.5px;fill:#5B6B73;}
    .tt{font-size:12.5px;font-weight:600;}
    .l{stroke:#16212B;stroke-width:1.3;fill:none;marker-end:url(#arrow);}
  </style>

  <!-- Entree -->
  <rect class="b" x="300" y="10" width="300" height="58"/>
  <text x="450" y="30" class="t tt" text-anchor="middle">spectre brut MALDI-TOF</text>
  <text x="450" y="46" class="ts" text-anchor="middle">resample 2000-20000 Da (3 Da/bin) + TIC</text>
  <text x="450" y="60" class="ts" text-anchor="middle">+ SNIP (baseline, 150 it., opt-in)</text>

  <path class="l" d="M450,68 L450,84 L200,84 L200,100"/>
  <path class="l" d="M450,68 L450,84 L700,84 L700,100"/>

  <!-- Vues augmentees -->
  <rect class="b ba" x="80" y="100" width="240" height="42"/>
  <text x="200" y="126" class="t" text-anchor="middle">vue 1 (warp + masque + bruit)</text>
  <rect class="b bb" x="580" y="100" width="240" height="42"/>
  <text x="700" y="126" class="t" text-anchor="middle">vue 2 (warp + masque + bruit)</text>

  <path class="l" d="M200,142 L200,162"/>
  <path class="l" d="M700,142 L700,162"/>

  <!-- Encodeur -->
  <rect class="b ba" x="80" y="162" width="240" height="46"/>
  <text x="200" y="189" class="t tt" text-anchor="middle">Encodeur ResNet-1D</text>
  <rect class="b bb" x="580" y="162" width="240" height="46"/>
  <text x="700" y="189" class="t tt" text-anchor="middle">Encodeur ResNet-1D</text>
  <path d="M320,185 L580,185" stroke="#8A9AA6" stroke-width="1.2" stroke-dasharray="2 5" marker-end="url(#arrow)" marker-start="url(#arrow)" fill="none"/>
  <text x="450" y="177" class="ts" text-anchor="middle">poids partages</text>

  <path class="l" d="M200,208 L200,227"/>
  <path class="l" d="M700,208 L700,227"/>

  <!-- Perte VICRegL -->
  <rect class="b" x="330" y="227" width="240" height="70" rx="5"/>
  <text x="450" y="249" class="t tt" text-anchor="middle">Perte VICRegL</text>
  <text x="450" y="267" class="ts" text-anchor="middle">global : invariance+variance+covariance</text>
  <text x="450" y="281" class="ts" text-anchor="middle">local : appariement position m/z + feature</text>
  <path d="M200,227 L200,262 L330,262" stroke="#16212B" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M700,227 L700,262 L570,262" stroke="#16212B" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <text x="450" y="315" class="ts" text-anchor="middle" font-style="italic">— entrainement auto-supervise, aucun label —</text>

  <path class="l" d="M450,297 L450,335"/>

  <!-- Encodeur gele -->
  <rect class="b" x="330" y="335" width="240" height="42" rx="5"/>
  <text x="450" y="361" class="t tt" text-anchor="middle">Encodeur gele</text>

  <path class="l" d="M450,377 L450,397"/>

  <!-- Pooling spatial -->
  <rect class="b bn" x="260" y="397" width="380" height="58" rx="5"/>
  <text x="450" y="419" class="t tt" text-anchor="middle">Pooling spatial (segments m/z)</text>
  <text x="450" y="437" class="ts" text-anchor="middle">carte locale (47 positions) decoupee en n tronçons</text>
  <text x="450" y="450" class="ts" text-anchor="middle">contigus, moyennes puis concatenes — n="max" par defaut</text>

  <path class="l" d="M450,455 L450,475"/>

  <!-- Sonde -->
  <rect class="b" x="280" y="475" width="340" height="60" rx="5"/>
  <text x="450" y="497" class="t tt" text-anchor="middle">Sonde lineaire (StandardScaler + LogReg)</text>
  <text x="450" y="515" class="ts" text-anchor="middle">identification d'espece, eval cross-centre</text>
  <text x="450" y="528" class="ts" text-anchor="middle">vs RF-binned (baseline)</text>

  <!-- Note laterale sur le pooling -->
  <rect class="b" x="640" y="397" width="220" height="58" rx="5" stroke-dasharray="3 3" stroke="#5B6B73"/>
  <text x="750" y="416" class="ts" text-anchor="middle" font-weight="600">n=1</text>
  <text x="750" y="430" class="ts" text-anchor="middle">= ancien comportement</text>
  <text x="750" y="444" class="ts" text-anchor="middle">(moyenne globale,</text>
  <text x="750" y="456" class="ts" text-anchor="middle">garde pour AMR/petits jeux)</text>
</svg>
